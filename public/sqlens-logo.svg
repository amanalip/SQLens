<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Detective Fedora Hat -->
  <g id="fedora-hat">
    <!-- Hat Crown -->
    <path d="M 68 75 C 65 45, 80 32, 100 35 C 120 32, 135 45, 132 75 Z" fill="url(#hatGrad)" />
    <!-- Hat Crease Indent -->
    <path d="M 85 36 C 95 44, 105 44, 115 36" fill="none" stroke="#1e40af" stroke-width="3.5" stroke-linecap="round" />
    <!-- Hat Ribbon / Band -->
    <path d="M 67 70 C 85 67, 115 67, 133 70 L 134 76 C 115 73, 85 73, 66 76 Z" fill="url(#bandGrad)" />
    <!-- Hat Brim -->
    <path d="M 40 82 C 60 74, 140 74, 160 82 C 165 84, 155 88, 140 88 C 100 88, 60 88, 40 82 Z" fill="url(#hatGrad)" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.3))" />
  </g>

  <!-- Database Cylinder (Examined Subject) -->
  <g id="database-cylinder" transform="translate(108, 92)">
    <!-- Cylinder Base -->
    <path d="M 0 38 C 0 45, 34 45, 34 38 L 34 50 C 34 57, 0 57, 0 50 Z" fill="url(#dbGrad)" opacity="0.85" />
    <!-- Cylinder Middle -->
    <path d="M 0 24 C 0 31, 34 31, 34 24 L 34 36 C 34 43, 0 43, 0 36 Z" fill="url(#dbGrad)" opacity="0.9" />
    <!-- Cylinder Top Body -->
    <path d="M 0 10 C 0 17, 34 17, 34 10 L 34 22 C 34 29, 0 29, 0 22 Z" fill="url(#dbGrad)" />
    <!-- Cylinder Top Cap -->
    <ellipse cx="17" cy="10" rx="17" ry="7" fill="#7dd3fc" />
  </g>

  <!-- Detective Magnifying Glass / Lens -->
  <g id="magnifying-lens">
    <!-- Lens Glow / Background -->
    <circle cx="125" cy="122" r="32" fill="url(#lensGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Lens Rim Outer -->
    <circle cx="125" cy="122" r="33" fill="none" stroke="#f59e0b" stroke-width="4.5" filter="url(#glow)" />
    <!-- Lens Glare Reflection -->
    <path d="M 103 112 C 108 100, 122 95, 134 98" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <!-- Lens Handle -->
    <line x1="102" y1="145" x2="72" y2="175" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <line x1="102" y1="145" x2="72" y2="175" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <circle cx="70" cy="177" r="4.5" fill="#b45309" />
  </g>

  <!-- Sleuth Monocle / Eye Wink Line -->
  <g id="detective-eyes" opacity="0.9">
    <circle cx="78" cy="108" r="4" fill="#3b82f6" />
    <path d="M 72 102 C 76 99, 82 99, 86 102" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
